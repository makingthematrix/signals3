name: Scala CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: graalvm
        java-version: 25
    - name: Setup sbt launcher
      uses: sbt/setup-sbt@v1
      with:
        sbt-runner-version: 1.13.0
    - name: Build and test
      run: sbt "clean ; compile ; test ; shutdown"
